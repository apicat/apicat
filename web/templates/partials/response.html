{{define "response"}}
<div class="response-block">
  <span class="status-badge {{statusClass .StatusCode}}">{{.StatusCode}}</span>
  <span class="response-desc">{{.Description}}</span>
  {{range .Content}}
  <div class="media-type-label">{{.MediaType}}</div>
  {{if .Schema}}
  {{template "schema" .Schema}}
  {{end}}
  {{end}}
</div>
{{end}}
