{{define "layout"}}<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}} — API Documentation</title>
  <script>
    // Apply saved theme before first paint to avoid a flash; no saved value
    // means "system" and Bulma's prefers-color-scheme rules take over.
    (function () {
      try {
        var t = localStorage.getItem("apicat-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/static/css/bulma.min.css">
  <link rel="stylesheet" href="/static/css/apicat.css">
</head>
<body>
  <button class="mobile-toggle" aria-label="Toggle navigation">&#9776;</button>
  <div class="theme-control">
    <button class="theme-toggle" aria-label="Theme" aria-haspopup="true" aria-expanded="false">&#9681;</button>
    <div class="theme-menu" hidden>
      <button type="button" data-theme-value="light"><span>&#9728; Light</span></button>
      <button type="button" data-theme-value="system"><span>&#9681; Auto</span></button>
      <button type="button" data-theme-value="dark"><span>&#9789; Dark</span></button>
    </div>
  </div>
  <div class="app-layout">
    {{template "nav" .}}
    <main class="app-content">
      {{if eq .Page "overview"}}
        {{template "overview_content" .}}
      {{else if eq .Page "endpoints"}}
        {{template "endpoints_content" .}}
      {{end}}
    </main>
  </div>
  <script src="/static/js/apicat.js"></script>
</body>
</html>{{end}}
